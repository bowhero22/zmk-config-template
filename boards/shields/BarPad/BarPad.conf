# ZMK Split Peripheral 설정 (동글 연동용)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_ROLE_CENTRAL=n

# [공식 문서 기준] Eager Debouncing 설정 (Press 0ms 즉시 입력, Release 5ms 챗터링 방지)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# USB 유선 연결 시 1000Hz (1ms) 폴링레이트 강제
CONFIG_USB_HID_POLL_INTERVAL=1

# 2.4GHz BLE 무선 성능 극대화 (2M PHY & +8dBm 송신 파워)
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 엔코더 및 RGB Underglow
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# 무선 입력 지연 방지를 위해 Deep Sleep 비활성화
CONFIG_ZMK_SLEEP=y
