on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.5
    name: Build Firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. C/C++ 컴파일 캐시 설정 (컨테이너 내부 경로 고정)
      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('config/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 2. West 모듈 캐시 설정 (west update 다운로드 대폭 단축)
      - name: Cache West Modules
        uses: actions/cache@v4
        with:
          path: |
            .west
            modules
            tools
            zephyr
            bootloader
            zmk
          key: ${{ runner.os }}-west-${{ hashFiles('config/west.yml', '**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      - name: West Init
        run: west init -l config || west init -l . || true

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      # 3. BarPad 본체 빌드 (독립 빌드 폴더: build/barpad)
      - name: West Build (BarPad)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          west build -s zmk/app -b xiao_ble -d build/barpad -- -DSHIELD=BarPad -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          cp build/barpad/zephyr/zmk.uf2 BarPad_xiao_ble.uf2

      # 4. BarPad Dongle 수신기 빌드 (독립 빌드 폴더: build/dongle)
      - name: West Build (BarPad Dongle)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          west build -s zmk/app -b nrf52840dongle/nrf52840 -d build/dongle -- -DSHIELD=BarPad_dongle -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_STUDIO=n -DEXTRA_DTC_OVERLAY_FILE=""
          cp build/dongle/zephyr/zmk.hex BarPad_dongle_nrf52840.hex

      # 5. 결과물 아카이브 업로드
      - name: Archive Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            BarPad_xiao_ble.uf2
            BarPad_dongle_nrf52840.hex
