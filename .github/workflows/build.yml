on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.5
    name: Build Firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. C/C++ 컴파일 캐시 (빌드 속도 단축)
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 2. West 모듈 및 .west 설정 캐시 (다운로드 속도 단축)
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            .west
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l config || west init -l . || true

      - name: West Update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      # 1. BarPad 본체 빌드
      - name: West Build (BarPad)
        run: west build -s zmk/app -b xiao_ble -- -DSHIELD=BarPad -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Rename BarPad UF2
        run: cp build/zephyr/zmk.uf2 BarPad_xiao_ble.uf2

      # 2. BarPad Dongle (nRF52840 Dongle) 수신기 빌드
      - name: West Build (BarPad Dongle)
        run: west build -p -s zmk/app -b nrf52840dongle/nrf52840 -- -DSHIELD=BarPad_dongle -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DEXTRA_DTC_OVERLAY_FILE=""

      - name: Rename BarPad Dongle HEX
        run: cp build/zephyr/zmk.hex BarPad_dongle_nrf52840.hex

      # 결과물 업로드
      - name: Archive Firmwares
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            BarPad_xiao_ble.uf2
            BarPad_dongle_nrf52840.hex
